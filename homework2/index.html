
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drum Kit Engine</title>
</head>
<body>
  <header>
    <h1>Drum Kit Engine</h1>
    <p>Play drum sounds using your keyboard or mouse.</p>
  </header>

  <main id="main-content">
    <section aria-labelledby="drum-heading">
      <h2 id="drum-heading">Drum Pads</h2>

      <section class="drum-kit" aria-label="Drum controls">
        <button type="button" class="drum-pad" data-key="a" data-sound="sounds/kick.wav">
          A - Kick
        </button>

        <button type="button" class="drum-pad" data-key="s" data-sound="sounds/snare.wav">
          S - Snare
        </button>

        <button type="button" class="drum-pad" data-key="d" data-sound="sounds/hihat.wav">
          D - Hi-Hat
        </button>

        <button type="button" class="drum-pad" data-key="f" data-sound="sounds/clap.wav">
          F - Clap
        </button>
      </section>
    </section>
  </main>

  <footer>
    <p>Homework 2 - Web Application Development</p>
  </footer>
</body>
</html>
