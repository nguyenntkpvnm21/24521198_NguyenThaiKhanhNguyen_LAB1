
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drum Kit Engine</title>
  <meta
  name="description"
  content="An interactive drum kit web application with keyboard controls, polyphonic audio playback, and a beat recorder."
>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A5%81%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Drum Kit Engine</h1>
    <p>Play drum sounds using your keyboard or mouse.</p>
  </header>

  <main id="main-content">
    <section aria-labelledby="drum-heading">
      <h2 id="drum-heading">Drum Pads</h2>

      <section class="drum-kit" aria-label="Drum controls">
        <button type="button" class="drum-pad" data-key="a" data-sound="sounds/kick.wav">
          A - Kick
        </button>

        <button type="button" class="drum-pad" data-key="s" data-sound="sounds/snare.wav">
          S - Snare
        </button>

        <button type="button" class="drum-pad" data-key="d" data-sound="sounds/hihat.wav">
          D - Hi-Hat
        </button>

        <button type="button" class="drum-pad" data-key="f" data-sound="sounds/clap.wav">
          F - Clap
        </button>
      </section>
    </section>
    
    
<section class="recorder" aria-labelledby="recorder-heading">
  <h2 id="recorder-heading">Beat Recorder</h2>

  <p id="recorder-status" role="status">
    Ready to record
  </p>

  <section class="recorder-controls" aria-label="Recording controls">
    <button type="button" id="record-btn">
      Start Recording
    </button>

    <button type="button" id="stop-btn" disabled>
      Stop
    </button>

    <button type="button" id="replay-btn" disabled>
      Replay
    </button>

    <button type="button" id="clear-btn" disabled>
      Clear
    </button>
  </section>
</section>


  </main>

  <footer>
    <p>Homework 2 - Web Application Development</p>
  </footer>
  <script type="module" src="js/app.js"></script>
</body>
</html>
